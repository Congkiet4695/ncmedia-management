<!-- Organization Approved (§8). -->
<h1 style="margin: 0 0 16px; font-size: 20px; line-height: 28px; font-weight: 600; color: #101828;">
  Organization đã được duyệt
</h1>

<p style="margin: 0 0 16px; font-size: 14px; line-height: 22px; color: #475467;">
  Xin chào {{FULL_NAME}},
</p>

<p style="margin: 0 0 16px; font-size: 14px; line-height: 22px; color: #475467;">
  Xin chúc mừng. Organization <strong style="color: #101828;">{{ORGANIZATION_NAME}}</strong>
  của bạn đã được xét duyệt.
</p>

<p style="margin: 0 0 24px; font-size: 14px; line-height: 22px; color: #475467;">
  Bạn có thể đăng nhập và sử dụng hệ thống.
</p>

<!-- Link đăng nhập chỉ xuất hiện ở email NÀY: đây là lần đầu tiên nó thật sự dùng được. -->
<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="border-radius: 8px; background-color: #101828;">
      <a href="{{LOGIN_URL}}" style="display: inline-block; padding: 11px 20px; font-size: 14px; font-weight: 600; color: #ffffff; text-decoration: none;">
        Đăng nhập
      </a>
    </td>
  </tr>
</table>

<p style="margin: 24px 0 0; font-size: 13px; line-height: 20px; color: #98a2b3;">
  Nếu nút trên không hoạt động, mở đường dẫn sau trong trình duyệt:<br />
  <span style="color: #475467; word-break: break-all;">{{LOGIN_URL}}</span>
</p>
