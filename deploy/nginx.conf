# ============================================================================
# NCMedia Management Platform — Nginx reverse proxy (mounted at conf.d/default.conf)
# Cloudflare → Nginx → Frontend (Next :3000) / Backend (Nest :3000, prefix /api/v1)
#
# - 1 server block listen 80 + 443 (KHÔNG redirect 80→443 ở origin) → không redirect loop
#   với mọi chế độ Cloudflare (Flexible/Full). Ép HTTPS bằng "Always Use HTTPS" ở Cloudflare.
# - HTTP/2, Gzip, WebSocket upgrade, Security headers, upload tối đa 50MB, cache static.
# - /uploads phục vụ trực tiếp từ bind mount (offload backend).
# ============================================================================

# --- http-context (file được include bên trong http{}) ---
upstream ncmedia_backend {
    server backend:3000;
    keepalive 32;
}
upstream ncmedia_frontend {
    server frontend:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml application/xml+rss
    application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # TLS (Cloudflare Origin Certificate hoặc self-signed fallback — deploy.sh đảm bảo tồn tại)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Upload tối đa 50MB (Avatar / Order / Excel / QR / Product)
    client_max_body_size 50m;

    # Security headers (áp cho toàn server; static locations tự set cache riêng)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;

    # Health check nội bộ cho Nginx
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ACME challenge (Let's Encrypt — tuỳ chọn)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Backend API (giữ nguyên path /api/v1/...) ---
    location /api/ {
        proxy_pass http://ncmedia_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --- Uploads: phục vụ trực tiếp từ bind mount (RO) ---
    location /uploads/ {
        alias /var/www/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # --- Next static assets (immutable, cache dài) ---
    location /_next/static/ {
        proxy_pass http://ncmedia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- Frontend (Next.js standalone) ---
    location / {
        proxy_pass http://ncmedia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
