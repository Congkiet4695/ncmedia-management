# ============================================================================
# NCMedia Management Platform — PRODUCTION stack (Ubuntu 24.04 / Docker + Compose v2)
# Internet → Cloudflare → Nginx → Frontend (Next) → Backend (Nest) → Postgres/Redis
#
# - Bind Mount toàn bộ (KHÔNG named volume). Host paths mặc định /opt/ncmedia/... —
#   có thể override qua biến (NCMEDIA_*) khi verify ở môi trường khác.
# - CHỈ publish 80/443 (Nginx). Postgres/Redis/Backend/Frontend KHÔNG expose ra Internet.
# - depends_on dùng service_healthy. restart: unless-stopped.
#
# ── CẤU HÌNH BIẾN MÔI TRƯỜNG ────────────────────────────────────────────────
# `.env.production` được dùng theo HAI đường KHÁC NHAU, đừng nhầm lẫn:
#
#   1. `--env-file .env.production` (deploy.sh)  → nội suy `${...}` TRONG file compose này.
#      Chỉ ảnh hưởng chính file YAML, KHÔNG tự động vào container.
#   2. `env_file:` trên từng service            → nạp TOÀN BỘ biến VÀO container.
#
# Nhờ (2), thêm biến mới cho backend chỉ cần sửa `.env.production` — KHÔNG phải
# đụng vào file này nữa. Xem docs/deployment-env.md.
#
# Thứ tự ưu tiên của Compose: `environment` > `env_file` > ENV trong image.
# Vì vậy khối `environment` bên dưới chỉ chứa hai loại biến:
#   (a) giá trị do Compose TÍNH TOÁN từ topology (tên service `postgres`/`redis`);
#   (b) giá trị BẮT BUỘC khoá cứng vì hạ tầng phụ thuộc vào nó (PORT, API_PREFIX
#       phải khớp HEALTHCHECK trong Dockerfile và upstream trong nginx.conf).
# Mọi biến còn lại (secret, TikTok, R2, Mango, cờ tính năng…) đi qua `env_file`.
# ============================================================================

name: ncmedia-prod

# ---------------------------------------------------------------------------
# Neo dùng chung — tránh lặp giữa `backend` và `seed` (cùng chạy mã Nest/Prisma).
# ---------------------------------------------------------------------------

# Toàn bộ biến ứng dụng. Thêm biến mới ⇒ chỉ sửa .env.production.
# Đường dẫn nội suy từ `ENV_FILE` (deploy.sh export sẵn) để `ENV_FILE=.env.staging`
# đổi được CẢ nguồn nội suy `${...}` lẫn file nạp vào container — không lệch nhau.
x-app-env-file: &app-env-file
  - ${ENV_FILE:-.env.production}

# Chuỗi kết nối DB nội bộ mạng Docker. PHẢI ghi đè giá trị cùng tên trong
# .env.production (nếu có) vì ở đó DATABASE_URL thường trỏ localhost.
x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

services:
  # Postgres/Redis KHÔNG dùng `env_file`: image của chúng đọc nhiều biến điều khiển
  # (POSTGRES_INITDB_ARGS, POSTGRES_HOST_AUTH_METHOD…). Nạp cả file .env ứng dụng vào
  # đây sẽ biến một biến đặt nhầm tên thành thay đổi hành vi khởi tạo database.
  postgres:
    image: postgres:16-alpine
    container_name: ncmedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${NCMEDIA_POSTGRES_DATA:-/opt/ncmedia/data/postgres}:/var/lib/postgresql/data
    networks:
      - ncmedia
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: ncmedia-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${NCMEDIA_REDIS_DATA:-/opt/ncmedia/data/redis}:/data
    networks:
      - ncmedia
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      target: runtime
    image: ncmedia-backend:latest
    container_name: ncmedia-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Toàn bộ biến ứng dụng — thêm biến mới KHÔNG cần sửa file này.
    env_file: *app-env-file
    environment:
      <<: *database-url
      # Khoá cứng: hạ tầng phụ thuộc trực tiếp vào ba giá trị này.
      #   PORT + API_PREFIX ↔ HEALTHCHECK trong apps/backend/Dockerfile và upstream nginx.conf.
      #   NODE_ENV ↔ nhánh production của ConfigModule/Prisma/pino.
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      # Tính từ topology mạng Docker — luôn khác giá trị dùng khi chạy máy local.
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ${NCMEDIA_UPLOADS:-/opt/ncmedia/uploads}:/app/uploads
      - ${NCMEDIA_LOGS:-/opt/ncmedia/logs}:/app/logs
    networks:
      - ncmedia

  # Frontend nhận cấu hình lúc BUILD (Next.js inline biến NEXT_PUBLIC_* vào bundle),
  # nên dùng `build.args` chứ KHÔNG phải `env_file` — biến runtime sẽ không có tác dụng.
  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NCMedia Management Platform}
    image: ncmedia-frontend:latest
    container_name: ncmedia-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ncmedia

  nginx:
    image: nginx:1.27-alpine
    container_name: ncmedia-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NCMEDIA_UPLOADS:-/opt/ncmedia/uploads}:/var/www/uploads:ro
      - ${NCMEDIA_CERTS:-/opt/ncmedia/certs}:/etc/nginx/certs:ro
      - ${NCMEDIA_LOGS:-/opt/ncmedia/logs}/nginx:/var/log/nginx
    networks:
      - ncmedia
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------------
  # One-off tools (profile "tools" — KHÔNG chạy khi `up`). Dùng cho seed lần đầu:
  #   docker compose -f deploy/docker-compose.production.yml --profile tools \
  #     run --rm seed
  # Build target=build (có ts-node) để chạy `prisma db seed`.
  # ------------------------------------------------------------------------
  seed:
    profiles: ['tools']
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      target: build
    image: ncmedia-backend-tools:latest
    # Dùng chung .env với backend: seed sau này có thể cần thêm biến (vd khoá mã hoá).
    env_file: *app-env-file
    environment:
      <<: *database-url
      # Production: KHÔNG tạo Demo Org/Admin. Ghi đè có chủ ý — seed.ts mặc định BẬT
      # (`SEED_DEMO !== 'false'`), thiếu dòng này là tạo nhầm admin demo trên production.
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'prisma', 'db', 'seed']
    networks:
      - ncmedia
    restart: 'no'

networks:
  ncmedia:
    name: ncmedia
    driver: bridge
