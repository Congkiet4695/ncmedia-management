# ============================================================================
# NCMedia Management Platform — PRODUCTION stack (Ubuntu 24.04 / Docker + Compose v2)
# Internet → Cloudflare → Nginx → Frontend (Next) → Backend (Nest) → Postgres/Redis
#
# - Bind Mount toàn bộ (KHÔNG named volume). Host paths mặc định /opt/ncmedia/... —
#   có thể override qua biến (NCMEDIA_*) khi verify ở môi trường khác.
# - CHỈ publish 80/443 (Nginx). Postgres/Redis/Backend/Frontend KHÔNG expose ra Internet.
# - depends_on dùng service_healthy. restart: unless-stopped.
# - Secrets nạp từ .env.production (KHÔNG hardcode).
# ============================================================================

name: ncmedia-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: ncmedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${NCMEDIA_POSTGRES_DATA:-/opt/ncmedia/data/postgres}:/var/lib/postgresql/data
    networks:
      - ncmedia
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: ncmedia-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${NCMEDIA_REDIS_DATA:-/opt/ncmedia/data/redis}:/data
    networks:
      - ncmedia
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      target: runtime
    image: ncmedia-backend:latest
    container_name: ncmedia-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      REFRESH_TOKEN_HMAC_SECRET: ${REFRESH_TOKEN_HMAC_SECRET}
      ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      UPLOAD_PATH: ${UPLOAD_PATH:-/app/uploads}
    volumes:
      - ${NCMEDIA_UPLOADS:-/opt/ncmedia/uploads}:/app/uploads
      - ${NCMEDIA_LOGS:-/opt/ncmedia/logs}:/app/logs
    networks:
      - ncmedia

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NCMedia Management Platform}
    image: ncmedia-frontend:latest
    container_name: ncmedia-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ncmedia

  nginx:
    image: nginx:1.27-alpine
    container_name: ncmedia-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NCMEDIA_UPLOADS:-/opt/ncmedia/uploads}:/var/www/uploads:ro
      - ${NCMEDIA_CERTS:-/opt/ncmedia/certs}:/etc/nginx/certs:ro
      - ${NCMEDIA_LOGS:-/opt/ncmedia/logs}/nginx:/var/log/nginx
    networks:
      - ncmedia
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------------
  # One-off tools (profile "tools" — KHÔNG chạy khi `up`). Dùng cho seed lần đầu:
  #   docker compose -f deploy/docker-compose.production.yml --profile tools \
  #     run --rm seed
  # Build target=build (có ts-node) để chạy `prisma db seed`.
  # ------------------------------------------------------------------------
  seed:
    profiles: ['tools']
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      target: build
    image: ncmedia-backend-tools:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'prisma', 'db', 'seed']
    networks:
      - ncmedia
    restart: 'no'

networks:
  ncmedia:
    name: ncmedia
    driver: bridge
